name: Verify application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  laravel:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testing-only
          MYSQL_DATABASE: ledger_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptesting-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ledger_test
      DB_USERNAME: root
      DB_PASSWORD: testing-only
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, mbstring, dom, fileinfo
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: composer validate --strict --no-check-publish
      - run: vendor/bin/pint --test
      - run: php vendor/phpunit/phpunit/phpunit
      - run: php artisan view:cache

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t account-ledger:test .
      - name: Check Apache routing and production headers
        shell: bash
        run: |
          key="$(docker run --rm --entrypoint php account-ledger:test artisan key:generate --show)"
          docker run -d --name ledger -p 8080:10000 -e APP_KEY="$key" -e APP_URL=http://localhost:8080 -e DB_CONNECTION=mysql -e DB_HOST=127.0.0.1 -e DB_DATABASE=unavailable -e DB_USERNAME=unavailable account-ledger:test
          trap 'docker logs ledger; docker rm -f ledger' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/up > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/up > /dev/null
          curl -fsS http://localhost:8080/ | grep -q 'POS Account Ledger'
          curl -fsS http://localhost:8080/about | grep -q 'Eloquent model'
          curl -fsS http://localhost:8080/assets/ledger.css > /dev/null
          curl -fsSI http://localhost:8080/ | grep -qi 'Content-Security-Policy:'
          test "$(curl -s -o /tmp/directory.html -w '%{http_code}' http://localhost:8080/customers)" = 503
          grep -q 'Directory temporarily unavailable' /tmp/directory.html
